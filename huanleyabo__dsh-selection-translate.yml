url: https://github.com/huanleyabo/dsh-selection-translate
name: huanleyabo/dsh-selection-translate
category: ui
description:
  en: 'Adds a select-to-translate button to the DSH web client: selecting any text in the transcript, a tool output, a document preview or an input shows a small translate button beside the selection, and clicking it translates the text in place. Translation runs through the host llm service, so it reuses the model the current session already has selected and needs no separate API key; an OpenAI-compatible endpoint can be configured instead. The result appears in a popover that stays inside the viewport, with one-click copy, a row of target-language buttons for instant retranslation, and smart Chinese-to-English / other-to-Chinese as the default. API keys are stored host-side in ~/.dsh/selection-translate.json and are never sent to the browser.'
  zh: '为 DSH 网页客户端增加划词翻译：选中聊天记录、工具输出、文档预览或输入框里的任意文字，选区旁会出现一个翻译按钮，点击即就地翻译。翻译走宿主 llm 服务，直接复用当前会话已选的模型，无需另外配置 API Key；也可改用任意 OpenAI 兼容端点。结果展示在自动保持于视口内的浮层里，支持一键复制、一排目标语言按钮即时重译，默认智能中英互译（中文译英、其他语言译中）。API Key 保存在宿主端 ~/.dsh/selection-translate.json，永不下发到浏览器。'
